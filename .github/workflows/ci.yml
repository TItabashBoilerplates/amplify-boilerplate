name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # lint / format / type-check。**検査の列挙は scripts/ci/check.sh が単一の正本**で、
  # ローカルの `ci-check`（devenv script）も同じものを呼ぶ。
  # ⚠️ 検査をここ（yml）に直接足さないこと。ローカルで再現できなくなる。
  ci-check:
    name: CI Check (lint + format + type-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install JS dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      # ⚠️ `--all-packages` を外さないこと。backend-py は uv の virtual workspace なので、
      # member の依存が入っていないと mypy から third-party が全部 `Any` に見え、
      # strict の untyped-decorator 等が**壊れていないコードに対して**誤爆する。
      - name: Sync Python workspace
        working-directory: backend-py
        run: uv sync --all-packages --all-groups --frozen
      # amplify_outputs.json は環境固有の生成物（gitignore）。CI では AWS へデプロイせず
      # 型チェック / ビルドを通すため、check.sh が公開情報のみのスタブを
      # （存在しないときだけ）配置する。
      - name: Run ci-check
        run: bash scripts/ci/check.sh

  test:
    name: Unit Tests (vitest + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install JS dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Sync Python workspace
        working-directory: backend-py
        run: uv sync --all-packages --all-groups --frozen
      # `.claude/rules/tdd.md` の All Green を CI でも担保する
      # （無いと「ローカルでは通っていたはず」で壊れたまま main に入る）。
      - name: Unit tests (vitest)
        working-directory: frontend
        run: pnpm run test
      - name: Unit tests (pytest)
        working-directory: backend-py
        run: uv run --all-packages pytest

  build:
    name: Build (next + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Stub amplify_outputs.json (no secrets; build only)
        working-directory: frontend
        run: |
          cp apps/web/amplify_outputs.ci.json apps/web/amplify_outputs.json
          cp apps/web/amplify_outputs.ci.json apps/mobile/amplify_outputs.json
      # web(next) と desktop(vite) の両方。desktop はここでしか壊れが出ない
      # （Rust 側は `-P desktop` が要るので CI では回さない）。
      - name: Build
        working-directory: frontend
        run: pnpm run build

  storybook:
    name: Storybook (build + render check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Stub amplify_outputs.json (no secrets)
        working-directory: frontend
        run: |
          cp apps/web/amplify_outputs.ci.json apps/web/amplify_outputs.json
          cp apps/web/amplify_outputs.ci.json apps/mobile/amplify_outputs.json
      - name: Build Storybook
        working-directory: frontend
        run: pnpm run build-storybook
      # ビルド成功は描画を保証しない（`.claude/rules/ui-testing.md`）。
      # 実行時エラー・未翻訳キーの露出・画像・入力欄の font-size を computed style で実測する。
      # ランナーに同梱の Chrome を使う（playwright-core はブラウザを同梱しない）。
      - name: Verify stories actually render
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node scripts/frontend/verify-storybook-render.mjs
