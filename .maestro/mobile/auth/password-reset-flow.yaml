# Mobile: パスワード再設定（6 桁コード方式）の往復
#
# Cognito のパスワードリセットは**コードベース**なので、Web / Mobile で実装を
# 分ける必要がない（ディープリンクも不要。`.claude/rules/auth.md` §3.2）。
#
# **「送信できた」で終わらせない。** コードを受け取って確定し、
# **新しいパスワードで実際にログインできるところまで**を 1 本で踏む。
# ここを踏まないテストは、壊れていることに気づけない。
#
# 前提:
#   - `AUTH_E2E_OTP_CAPTURE=true` でデプロイした sandbox
#     （CustomEmailSender Lambda がコードを DynamoDB に書く。`.claude/skills/e2e-auth/`）
#   - `e2e-mobile` が localhost の OTP ブリッジを立てて OTP_BRIDGE_URL を渡す

appId: ${APP_ID}
name: "Mobile Password Reset Round Trip"
jsEngine: graaljs
tags:
  - auth
  - mobile
  - e2e

---
- launchApp:
    clearState: true
    permissions:
      all: allow

# 1. ログイン画面から再設定へ進めること
- openLink: "mobile://sign-in"
- tapOn: "Forgot your password?"
- assertVisible: "Reset your password"

# 2. コードを申請
- tapOn: "Email address"
- inputText: ${TEST_EMAIL}
- tapOn: "Send reset code"

# 3. 応答はアカウントの存在を漏らさない文言であること（ユーザー列挙対策）
- assertVisible: "If an account exists"

# 4. キャプチャ済みのコードを取り出す
- runScript:
    file: ../../scripts/get-auth-code.js
    env:
      OTP_BRIDGE_URL: ${OTP_BRIDGE_URL}
      TEST_EMAIL: ${TEST_EMAIL}
      MAX_RETRIES: "20"

# 5. コードと新パスワードを入力
- tapOn: "Verification code"
- inputText: ${output.authCode}
- tapOn: "New password"
- inputText: "N3wPassw0rd!x"
- tapOn: "Confirm new password"
- inputText: "N3wPassw0rd!x"
- tapOn: "Update password"

# 6. 実際に新しいパスワードでログインできること（ここまでで初めて「復帰できた」）
- assertVisible: "Sign in"
- tapOn: "Email address"
- inputText: ${TEST_EMAIL}
- tapOn: "Password"
- inputText: "N3wPassw0rd!x"
- tapOn: "Sign in"
- assertNotVisible: "Forgot your password?"
- takeScreenshot: mobile-password-reset-success
