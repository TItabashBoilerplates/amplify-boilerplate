# Mobile: アプリが起動してホームが描画されること（最小のスモーク）
#
# これが落ちたら他のフローを見る意味が無いので、最初に実行される想定。

appId: ${APP_ID}
name: "Mobile Home Screen Smoke"
tags:
  - smoke
  - mobile

---
- launchApp:
    clearState: true
    permissions:
      all: allow

- assertVisible:
    id: ".*"
    optional: false

- takeScreenshot: mobile-home-smoke
