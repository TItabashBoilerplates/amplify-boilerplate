# Web: パスワード再設定（6 桁コード方式）の往復
#
# Cognito のリセットはコードベースなので Web も Mobile と同じ 2 段階になる。
# **「送信できた」で終わらせず**、コードを入れて確定するところまで踏む。
#
# 前提: `AUTH_E2E_OTP_CAPTURE=true` の sandbox（コードが DynamoDB にキャプチャされる）
#       + `e2e-web` が立てる OTP ブリッジ

appId: com.example.web
name: "Web Password Reset Round Trip"
jsEngine: graaljs
tags:
  - auth
  - web
  - e2e

---
- launchApp:
    arguments:
      url: "http://localhost:3000/en/forgot-password"

- assertVisible: "Reset your password"

- tapOn: "Email Address"
- inputText: ${TEST_EMAIL}
- tapOn: "Send reset code"

# アカウントの存在を漏らさない文言であること（ユーザー列挙対策）
- assertVisible: "If an account exists"

- runScript:
    file: ../../scripts/get-auth-code.js
    env:
      OTP_BRIDGE_URL: ${OTP_BRIDGE_URL}
      TEST_EMAIL: ${TEST_EMAIL}
      MAX_RETRIES: "20"

- tapOn: "Verification code"
- inputText: ${output.authCode}
- tapOn: "New password"
- inputText: "N3wPassw0rd!x"
- tapOn: "Confirm new password"
- inputText: "N3wPassw0rd!x"
- tapOn: "Update password"

- assertVisible: "Your password has been updated."
- takeScreenshot: web-password-reset-success
