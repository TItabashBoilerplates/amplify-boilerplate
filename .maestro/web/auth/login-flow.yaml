# Web: メールアドレス + パスワードでログインする
#
# Web は OTP も併用できるが、**パスワードで入れる経路が生きていること**を守るのが目的。
# 同じ Cognito User Pool を Web / Mobile で共有するので、片方だけ壊れる状況を作らない
# （`.claude/rules/auth.md` §1）。
#
# 前提:
#   - `dev-web` で Next.js が :3000 で起動している
#   - `e2e-web`（= scripts/e2e/run-maestro.mjs）が TEST_EMAIL / TEST_PASSWORD を
#     Cognito に作成して渡す
#   - Maestro の web ドライバを使うので `--platform web` が必要（`e2e-web` が付与する）

appId: com.example.web
name: "Web Password Login"
tags:
  - auth
  - web
  - e2e

---
- launchApp:
    arguments:
      url: "http://localhost:3000/en/login"

- assertVisible: "Sign in"
# 忘れた人はログインできないので、この画面に導線が無いと詰む
- assertVisible: "Forgot your password?"

- tapOn: "Email Address"
- inputText: ${TEST_EMAIL}

- tapOn: "Password"
- inputText: ${TEST_PASSWORD}

- tapOn: "Sign in"

- assertNotVisible: "Forgot your password?"
- takeScreenshot: web-password-login-success
