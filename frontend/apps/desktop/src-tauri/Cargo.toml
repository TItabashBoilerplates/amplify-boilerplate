[package]
name = "app-desktop"
version = "0.1.0"
description = "Desktop app"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

# Tauri は lib（モバイル対応の共通エントリ）と bin（デスクトップ）の 2 本立てにする。
# 公式スキャフォールドと同じ構成なので、後から `tauri android init` 等を足せる。
[lib]
name = "app_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
# 既定で有効にはしない（`tauri dev` が必要に応じて付ける）
custom-protocol = ["tauri/custom-protocol"]
